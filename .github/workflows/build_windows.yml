name: Windows
on:
  workflow_call:

jobs:
  build:
    name: Build (amd64)

    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Setup MSYS2 (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            zip
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            mingw-w64-ucrt-x86_64-blueprint-compiler
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-gettext-tools
            mingw-w64-ucrt-x86_64-gst-libav
            mingw-w64-ucrt-x86_64-gst-plugins-bad
            mingw-w64-ucrt-x86_64-gst-plugins-base
            mingw-w64-ucrt-x86_64-gst-plugins-good
            mingw-w64-ucrt-x86_64-gst-plugins-ugly
            mingw-w64-ucrt-x86_64-gstreamer
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-libepoxy
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-mpv
            mingw-w64-ucrt-x86_64-ntldd
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-rust

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Build tsukimi
        env:
          DANDANAPI_SECRET_KEY: ${{ secrets.DANDANAPI_SECRET_KEY }}
        run: |
          meson setup build --prefix=/ucrt64
          meson compile -C build
          meson install -C build --destdir "$PWD/staging"

      - name: Package portable zip
        run: |
          # meson resolves /ucrt64 to a drive-lettered absolute path on
          # Windows, so locate the installed exe instead of hardcoding it.
          exe="$(find "$PWD/staging" -name tsukimi.exe | head -1)"
          prefix_dir="$(dirname "$(dirname "$exe")")"
          bash build-aux/package-windows.sh "$prefix_dir" tsukimi-amd64-windows

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: tsukimi-amd64-windows
          path: tsukimi-amd64-windows.zip
          archive: false
